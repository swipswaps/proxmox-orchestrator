<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var segs = location.pathname.split('/').filter(Boolean);
      if (segs.length > 0) {
        location.replace('/' + segs[0] + '/');
      } else {
        location.replace('/');
      }
    })();
  </script>
</head>
<body><p>Redirecting to <a href="/">home</a>…</p></body>
</html>
